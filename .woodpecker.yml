---
when:
  - event: push
    branch:
      - main
      - cursor/**
  - event: pull_request

steps:
  wordpress:
    name: pandlens-adresgegevens quality
    image: php:8.2-cli
    commands:
      - apt-get update && apt-get install -y git unzip libzip-dev zip gettext
      - docker-php-ext-install zip
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - cd wordpress/pandlens-adresgegevens
      - composer install --no-interaction --prefer-dist
      - find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - cd ../..
      - cd wordpress
      - pandlens-adresgegevens/vendor/bin/phpcs --standard=phpcs.xml.dist
      - pandlens-adresgegevens/vendor/bin/phpunit -c phpunit.xml.dist
      - msgfmt -o pandlens-adresgegevens/languages/pandlens-adresgegevens-nl_NL.mo pandlens-adresgegevens/languages/pandlens-adresgegevens-nl_NL.po
      - bash build-zip.sh

  integrations:
    name: zapier-n8n integrations
    image: node:22-bookworm-slim
    environment:
      NPM_CONFIG_IGNORE_SCRIPTS: "false"
    commands:
      - npm ci
      - npm run lint
      - node --test shared/test/*.test.js
      - (cd zapier && npm ci && npm run lint && npm test && npx zapier validate)
      - (cd n8n && npm ci && npm run lint && npm run build && npm test && npm run scan)
