---
when:
  - event: push
    branch:
      - main
      - cursor/**

steps:
  ci:
    image: node:22-bookworm-slim
    environment:
      NPM_CONFIG_IGNORE_SCRIPTS: "false"
    commands:
      - npm ci
      - npm run lint
      - node --test shared/test/*.test.js
      - cd zapier && npm ci && npm run lint && npm test && npx zapier validate
      - cd /woodpecker/src/github.com/WeavoDev/pandlens-integrations/n8n && npm ci && npm run lint && npm run build && npm test && npm run scan
